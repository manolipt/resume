name: Build and release resume

on:
  push:
    branches: [main]
    paths:
      - "**.tex"
      - "**.sty"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create private.tex from example
        env:
          RESUME_PHONE: ${{ secrets.RESUME_PHONE }}
          RESUME_PHONE_LINK: ${{ secrets.RESUME_PHONE_LINK }}
        run: |
          # Keep the example's structure, swapping in the real values.
          # Values are passed via env and awk -v to avoid shell/sed escaping issues.
          awk -v phone="$RESUME_PHONE" -v link="$RESUME_PHONE_LINK" '
            /\\newcommand\{\\phoneMe\}/     { print "\\newcommand{\\phoneMe}{" phone "}"; next }
            /\\newcommand\{\\phoneMeLink\}/ { print "\\newcommand{\\phoneMeLink}{" link "}"; next }
            { print }
          ' private.example.tex > private.tex

      - name: Compile (XeLaTeX)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: true

      - name: Upload to OneDrive
        env:
          TENANT: ${{ secrets.AZ_TENANT_ID }}
          CLIENT: ${{ secrets.AZ_CLIENT_ID }}
          SECRET: ${{ secrets.AZ_CLIENT_SECRET }}
          UPN: ${{ secrets.AZ_USER_UPN }}
        run: |
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CLIENT" -d "client_secret=$SECRET" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" | jq -r .access_token)
          curl -s -X PUT -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/pdf" \
            --data-binary @main.pdf \
            "https://graph.microsoft.com/v1.0/users/$UPN/drive/root:/PipelineOutputs/resume.pdf:/content"
